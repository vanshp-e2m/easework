services:
  db:
    image: postgres:16-alpine
    container_name: ease-work-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ease
      POSTGRES_PASSWORD: ease
      POSTGRES_DB: ease_work
    ports:
      - "5433:5432"
    volumes:
      - ease-work-db:/var/lib/postgresql/data

  # Backs up the database and uploaded files every few hours into ./backups
  # (or BACKUP_DIR). See backup/backup.sh; restore with `npm run restore`.
  backup:
    image: postgres:16-alpine
    container_name: ease-work-backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: ease
      PGPASSWORD: ease
      PGDATABASE: ease_work
      TZ: Asia/Kolkata
      BACKUP_INTERVAL_HOURS: 6
      BACKUP_KEEP: 28 # 7 days at one every 6 hours
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./server/uploads:/uploads
    entrypoint: ["sh", "/scripts/backup.sh"]

volumes:
  ease-work-db:
